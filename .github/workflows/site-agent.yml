name: Site Agent

on:
  pull_request:
    paths:
      - "site-agent/**"
      - ".github/workflows/site-agent.yml"
  push:
    branches: [main]
    paths:
      - "site-agent/**"
      - ".github/workflows/site-agent.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site-agent/package.json
      - name: Install agent dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck agent
        run: npm run typecheck
      - name: Deterministic smoke test
        run: |
          npm run dev -- --github octocat --out /tmp/site-spec.json
          node -e "const s=require('/tmp/site-spec.json'); if(s.version!==1 || s.meta.generatedBy!=='personal-site-agent') process.exit(1)"
