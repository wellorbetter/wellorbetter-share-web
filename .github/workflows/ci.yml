name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Boundary check (T006)
        run: npm run boundary-check
      - name: Contract check (T002/T003)
        run: npm run contract-check
      - name: Typecheck
        run: npm run typecheck
      - name: Build share
        run: npm run build -w @wellorbetter/share
      - name: Build landing
        run: npm run build -w @wellorbetter/landing
      - name: Deploy share (main only, secrets configured)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/share
        run: npx wrangler deploy
      - name: Deploy landing (main only, secrets configured)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push' && env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/landing
        run: npx wrangler deploy