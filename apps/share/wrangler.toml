name = "wellorbetter-share-web"
main = "src/worker.ts"
compatibility_date = "2024-08-01"

# 前后端分离：分享前端独立部署在 share 子域
routes = [
  { pattern = "share.wellorbetterai.com", custom_domain = true }
]

# 前端静态资源（apps/share 构建产物）
[assets]
directory = "./dist"
binding = "ASSETS"

[observability]
enabled = true