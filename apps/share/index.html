<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- .ico 先、svg 后：支持 SVG favicon 的浏览器取后者（标签页跟系统明暗走），
         不支持的取 .ico。跟落地页是同一份文件、同一套几何。 -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="description" content="wellorbetter 文件分享" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: data: blob:; media-src 'self' https:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' https:; frame-src https:; object-src 'none'; base-uri 'self'; form-action 'self' https:; frame-ancestors 'self'"
    />
    <title>wellorbetter 文件分享</title>
    <!-- 首屏主题引导。必须是外部文件：上面那条 CSP 写的是 script-src 'self'，
         没有 'unsafe-inline' —— 这段代码内联在这里的那段时间它一直被静默拦掉，
         深色用户每次打开都先闪一下浅色。不要改回内联。
         没有 defer/async：它要在第一次绘制之前跑完，这就是它的全部意义。 -->
    <script src="/theme-boot.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
